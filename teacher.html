<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AnvilSpark – Teacher</title>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --primary: #2F3640;
      --secondary: #F39C12;
      --accent: #3498DB;
      --bg: #F5F6FA;
      --text: #1E272E;
      --card-bg: #FFFFFF;
      --shadow: 0 4px 12px rgba(0,0,0,0.08);
      --radius: 12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); padding: 20px; }
    .app-header {
      background: var(--primary);
      color: white;
      padding: 16px 24px;
      border-radius: var(--radius);
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      box-shadow: var(--shadow);
    }
    .app-header .brand { display: flex; align-items: center; gap: 12px; }
    .app-header .brand .spark { color: var(--secondary); font-size: 1.8rem; font-weight: 300; }
    .app-header .brand h1 { font-size: 1.6rem; font-weight: 700; letter-spacing: -0.5px; }
    .app-header .brand h1 span { color: var(--secondary); }
    .app-header .tagline { font-size: 0.85rem; opacity: 0.8; font-weight: 300; }
    .container { max-width: 1400px; margin: 0 auto; background: var(--card-bg); padding: 24px; border-radius: var(--radius); box-shadow: var(--shadow); }
    .tabs { display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 2px solid #E9ECEF; padding-bottom: 8px; margin-bottom: 20px; }
    .tab { padding: 10px 20px; cursor: pointer; background: transparent; border: none; border-radius: 8px 8px 0 0; font-weight: 600; color: #6C7A89; transition: 0.2s; }
    .tab:hover { background: #F1F2F6; }
    .tab.active { background: var(--primary); color: white; }
    .tab-content { display: none; padding: 16px 0; }
    .tab-content.active { display: block; }
    .btn-primary { background: var(--primary); color: white; border: none; padding: 8px 20px; border-radius: 8px; cursor: pointer; font-weight: 600; transition: 0.2s; }
    .btn-primary:hover { background: #1E272E; transform: translateY(-1px); }
    .btn-secondary { background: var(--secondary); color: white; border: none; padding: 8px 20px; border-radius: 8px; cursor: pointer; font-weight: 600; transition: 0.2s; }
    .btn-secondary:hover { background: #D68910; transform: translateY(-1px); }
    .btn-accent { background: var(--accent); color: white; border: none; padding: 8px 20px; border-radius: 8px; cursor: pointer; font-weight: 600; transition: 0.2s; }
    .btn-accent:hover { background: #2E86C1; transform: translateY(-1px); }
    button:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; }
    .card { background: var(--bg); padding: 16px; border-radius: 8px; margin: 12px 0; }
    .question-list { max-height: 300px; overflow-y: auto; border: 1px solid #E9ECEF; padding: 10px; border-radius: 8px; }
    .question-item { padding: 8px; border-bottom: 1px solid #EEE; cursor: pointer; }
    .question-item.selected { background: #FFF3E0; border-left: 4px solid var(--secondary); }
    input, select, textarea { padding: 10px; border: 1px solid #DCE1E8; border-radius: 8px; width: 100%; max-width: 400px; font-size: 1rem; }
    textarea { max-width: 100%; height: 120px; }
    .group-box { display: inline-block; background: var(--bg); margin: 8px; padding: 16px; border-radius: 8px; min-width: 150px; border: 1px solid #E9ECEF; }
    .group-box strong { color: var(--primary); }
    .chart-container { max-width: 600px; margin: 16px auto; }
    @media (max-width: 768px) {
      .app-header { flex-direction: column; align-items: flex-start; gap: 8px; }
      .tabs { overflow-x: auto; flex-wrap: nowrap; }
      .tab { white-space: nowrap; }
    }
  </style>
</head>
<body>

<header class="app-header">
  <div class="brand">
    <span class="spark">⚡</span>
    <h1>Anvil<span>Spark</span></h1>
  </div>
  <div class="tagline">Forging Engagement. Igniting Learning.</div>
</header>

<div class="container">
  <div style="display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 16px;">
    <label style="font-weight: 600;">Room PIN:</label>
    <input type="text" id="pinInput" placeholder="e.g. 1234" value="1234" style="max-width: 140px;">
    <button class="btn-primary" id="joinRoomBtn">Join / Create Room</button>
  </div>

  <div class="tabs" id="tabsContainer">
    <button class="tab active" data-tab="roster">📋 Roster</button>
    <button class="tab" data-tab="questions">📝 Question Bank</button>
    <button class="tab" data-tab="quiz">🎯 Quiz</button>
    <button class="tab" data-tab="polls">📊 Polls</button>
    <button class="tab" data-tab="groups">👥 Groups</button>
    <button class="tab" data-tab="attendance">✅ Attendance</button>
  </div>

  <!-- ROSTER TAB -->
  <div id="roster" class="tab-content active">
    <h3>📋 Class Roster</h3>
    <p>Paste student names (one per line) to import.</p>
    <textarea id="rosterText" placeholder="Juan Dela Cruz&#10;Maria Santos&#10;..."></textarea>
    <br>
    <button class="btn-secondary" id="importRosterBtn">Import Roster</button>
    <div id="rosterStatus" class="card"></div>
    <h4>Current Roster</h4>
    <div id="rosterList" class="card"></div>
  </div>

  <!-- QUESTION BANK TAB -->
  <div id="questions" class="tab-content">
    <h3>📝 Question Bank</h3>
    <p>Import questions in <strong>Aiken format</strong>:</p>
    <textarea id="aikenText" placeholder="What is the capital of France?&#10;A. London&#10;B. Paris&#10;C. Berlin&#10;D. Madrid&#10;ANSWER: B"></textarea>
    <br>
    <button class="btn-secondary" id="importAikenBtn">Import Questions</button>
    <div id="aikenStatus" class="card"></div>
    <h4>Available Questions</h4>
    <div id="questionBankList" class="question-list"></div>
  </div>

  <!-- QUIZ TAB -->
  <div id="quiz" class="tab-content">
    <h3>🎯 Gamified Quiz</h3>
    <div style="display: flex; flex-wrap: wrap; gap: 16px; align-items: center;">
      <label>Scoring: 
        <select id="scoringMode"><option value="standard">Standard</option><option value="weighted">Weighted</option></select>
      </label>
      <label><input type="checkbox" id="enableSpeedBonus" checked> Speed Bonus</label>
      <label><input type="checkbox" id="enableStreak" checked> Streak Multiplier</label>
    </div>
    <div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin: 12px 0;">
      <label>Select Question: 
        <select id="questionSelect"><option value="">-- Choose --</option></select>
      </label>
      <button class="btn-primary" id="startQuestionBtn">▶ Start</button>
      <button class="btn-accent" id="closeQuestionBtn" disabled>⏹ Close & Score</button>
    </div>
    <div id="quizStatus" class="card"></div>
    <div id="liveAnswers" class="card"></div>
  </div>

  <!-- POLLS TAB -->
  <div id="polls" class="tab-content">
    <h3>📊 Live Polls</h3>
    <div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: center;">
      <input type="text" id="pollQuestion" placeholder="Poll question..." style="max-width: 300px;">
      <input type="text" id="pollOptions" placeholder="Yes, No, Maybe" value="Yes, No, Maybe" style="max-width: 250px;">
    </div>
    <button class="btn-primary" id="startPollBtn">▶ Start Poll</button>
    <button class="btn-accent" id="closePollBtn" disabled>⏹ Close Poll</button>
    <div id="pollStatus" class="card"></div>
    <div class="chart-container"><canvas id="pollChart"></canvas></div>
  </div>

  <!-- GROUPS TAB -->
  <div id="groups" class="tab-content">
    <h3>👥 Random Groups</h3>
    <div style="display: flex; gap: 12px; align-items: center;">
      <label>Number of Groups: <input type="number" id="numGroups" value="3" min="1" style="max-width: 80px;"></label>
      <button class="btn-secondary" id="generateGroupsBtn">🔄 Generate</button>
    </div>
    <div id="groupsContainer" style="display: flex; flex-wrap: wrap; gap: 12px; margin-top: 16px;"></div>
  </div>

  <!-- ATTENDANCE TAB -->
  <div id="attendance" class="tab-content">
    <h3>✅ Attendance Log</h3>
    <button class="btn-accent" id="refreshAttendanceBtn">⟳ Refresh</button>
    <div id="attendanceList" class="card"></div>
  </div>
</div>

<script>
  // ---------- CONFIG ----------
  const CONFIG = {
    ENDPOINT: "https://script.google.com/macros/s/YOUR_APPS_SCRIPT_WEB_APP_URL/exec",
  };
  const FIREBASE_CONFIG = {
    apiKey: "YOUR_API_KEY",
    databaseURL: "https://YOUR_PROJECT.firebaseio.com"
  };
  firebase.initializeApp(FIREBASE_CONFIG);
  const db = firebase.database();

  // ---------- State ----------
  let currentPin = '';
  let pollChartInstance = null;

  // ---------- Helpers ----------
  async function callAppsScript(action, params = {}) {
    const body = JSON.stringify({ action, ...params });
    const resp = await fetch(CONFIG.ENDPOINT, {
      method: 'POST',
      mode: 'cors',
      headers: { 'Content-Type': 'text/plain' },
      body: body
    });
    return resp.json();
  }

  // ---------- Tab Switching ----------
  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', function() {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      this.classList.add('active');
      document.querySelectorAll('.tab-content').forEach(tc => tc.classList.remove('active'));
      document.getElementById(this.dataset.tab).classList.add('active');
    });
  });

  // ---------- DOM refs ----------
  const pinInput = document.getElementById('pinInput');
  const joinBtn = document.getElementById('joinRoomBtn');
  const rosterText = document.getElementById('rosterText');
  const importRosterBtn = document.getElementById('importRosterBtn');
  const rosterStatus = document.getElementById('rosterStatus');
  const rosterList = document.getElementById('rosterList');
  const aikenText = document.getElementById('aikenText');
  const importAikenBtn = document.getElementById('importAikenBtn');
  const aikenStatus = document.getElementById('aikenStatus');
  const questionBankList = document.getElementById('questionBankList');
  const questionSelect = document.getElementById('questionSelect');
  const scoringMode = document.getElementById('scoringMode');
  const enableSpeedBonus = document.getElementById('enableSpeedBonus');
  const enableStreak = document.getElementById('enableStreak');
  const startBtn = document.getElementById('startQuestionBtn');
  const closeBtn = document.getElementById('closeQuestionBtn');
  const quizStatus = document.getElementById('quizStatus');
  const liveAnswersDiv = document.getElementById('liveAnswers');
  const pollQuestion = document.getElementById('pollQuestion');
  const pollOptions = document.getElementById('pollOptions');
  const startPollBtn = document.getElementById('startPollBtn');
  const closePollBtn = document.getElementById('closePollBtn');
  const pollStatus = document.getElementById('pollStatus');
  const pollChartCanvas = document.getElementById('pollChart');
  const numGroupsInput = document.getElementById('numGroups');
  const generateGroupsBtn = document.getElementById('generateGroupsBtn');
  const groupsContainer = document.getElementById('groupsContainer');
  const attendanceList = document.getElementById('attendanceList');
  const refreshAttendanceBtn = document.getElementById('refreshAttendanceBtn');

  // ---------- Join Room ----------
  joinBtn.addEventListener('click', async function() {
    currentPin = pinInput.value.trim();
    if (!currentPin) return alert('Enter a PIN.');
    await loadRoster();
    await loadQuestionBank();
    subscribeToQuizState();
    subscribeToPollState();
    subscribeToAttendance();
    document.querySelector('[data-tab="quiz"]').click();
  });

  // ---------- Roster ----------
  async function loadRoster() {
    if (!currentPin) return;
    const resp = await fetch(`${CONFIG.ENDPOINT}?action=getRoster&pin=${currentPin}`, { mode: 'cors' });
    const data = await resp.json();
    if (data.success) {
      rosterList.innerHTML = data.names.map(n => `<span style="display:inline-block;background:#e9ecef;padding:4px 8px;margin:4px;border-radius:12px;">${n}</span>`).join('');
    } else {
      rosterList.textContent = 'No roster yet.';
    }
  }

  importRosterBtn.addEventListener('click', async function() {
    const text = rosterText.value;
    const names = text.split('\n').map(s => s.trim()).filter(Boolean);
    if (!names.length) return alert('Enter at least one name.');
    const result = await callAppsScript('importRoster', { pin: currentPin, names });
    if (result.success) {
      rosterStatus.textContent = `Imported ${result.imported} names.`;
      rosterText.value = '';
      loadRoster();
    } else {
      rosterStatus.textContent = 'Error: ' + result.error;
    }
  });

  // ---------- Question Bank ----------
  async function loadQuestionBank() {
    const resp = await fetch(`${CONFIG.ENDPOINT}?action=getQuestionBank`, { mode: 'cors' });
    const data = await resp.json();
    if (data.success && data.questions) {
      questionSelect.innerHTML = '<option value="">-- Choose --</option>';
      data.questions.forEach(q => {
        const opt = document.createElement('option');
        opt.value = q.id;
        opt.textContent = q.question_text.substring(0, 50) + (q.question_text.length > 50 ? '...' : '');
        questionSelect.appendChild(opt);
      });
      questionBankList.innerHTML = data.questions.map(q => 
        `<div class="question-item" data-id="${q.id}">${q.question_text} (${q.correct_letter})</div>`
      ).join('');
      document.querySelectorAll('.question-item').forEach(el => {
        el.addEventListener('click', function() {
          const id = this.dataset.id;
          questionSelect.value = id;
          document.querySelectorAll('.question-item').forEach(i => i.classList.remove('selected'));
          this.classList.add('selected');
        });
      });
    }
  }

  importAikenBtn.addEventListener('click', async function() {
    const text = aikenText.value;
    if (!text) return alert('Paste Aiken questions.');
    const result = await callAppsScript('importAiken', { aikenText: text });
    if (result.success) {
      aikenStatus.textContent = `Imported ${result.imported} questions.`;
      aikenText.value = '';
      loadQuestionBank();
    } else {
      aikenStatus.textContent = 'Error: ' + result.error;
    }
  });

  // ---------- Quiz ----------
  function subscribeToQuizState() {
    if (!currentPin) return;
    const stateRef = db.ref(`rooms/${currentPin}/quiz`);
    stateRef.on('value', snapshot => {
      const state = snapshot.val();
      if (!state) return;
      if (state.status === 'active') {
        startBtn.disabled = true;
        closeBtn.disabled = false;
        const q = state.currentQuestion;
        if (q) {
          quizStatus.innerHTML = `<div style="background:#d4edda;padding:10px;border-radius:4px;">
            <strong>Active Question:</strong> ${q.text}<br>
            Options: A) ${q.options.A}  B) ${q.options.B}  C) ${q.options.C}  D) ${q.options.D}
          </div>`;
        }
        updateAnswersChart(state.answers || {});
      } else if (state.status === 'closed') {
        startBtn.disabled = false;
        closeBtn.disabled = true;
        quizStatus.innerHTML += `<div style="background:#fff3cd;padding:10px;border-radius:4px;">Question closed. Correct answer: ${state.correctAnswer || '?'}</div>`;
        if (state.leaderboard) {
          document.getElementById('teacherLeaderboard')?.remove();
          const lbDiv = document.createElement('div');
          lbDiv.id = 'teacherLeaderboard';
          lbDiv.innerHTML = `<ol>${state.leaderboard.slice(0,10).map(p => 
            `<li>${p.name} – ${p.points} pts (streak: ${p.streak})</li>`
          ).join('')}</ol>`;
          quizStatus.after(lbDiv);
        }
      } else {
        startBtn.disabled = false;
        closeBtn.disabled = true;
        quizStatus.innerHTML = '<span>No active question.</span>';
        document.getElementById('teacherLeaderboard')?.remove();
      }
    });
  }

  function updateAnswersChart(answers) {
    const counts = { A:0, B:0, C:0, D:0 };
    for (const [student, ans] of Object.entries(answers)) {
      const opt = ans.option.toUpperCase();
      if (counts.hasOwnProperty(opt)) counts[opt]++;
    }
    liveAnswersDiv.innerHTML = Object.entries(counts).map(([k,v]) => `${k}: ${v}`).join(' | ');
  }

  startBtn.addEventListener('click', async function() {
    const qid = questionSelect.value;
    if (!qid) return alert('Select a question.');
    const mode = scoringMode.value;
    const speed = enableSpeedBonus.checked;
    const streak = enableStreak.checked;
    const result = await callAppsScript('startQuizQuestion', {
      pin: currentPin,
      questionId: qid,
      scoringMode: mode,
      enableSpeedBonus: speed,
      enableStreak: streak
    });
    if (result.success) {
      quizStatus.innerHTML = 'Question started! Waiting for answers...';
      startBtn.disabled = true;
    } else {
      alert('Error: ' + result.error);
    }
  });

  closeBtn.addEventListener('click', async function() {
    if (!document.querySelector('#quizStatus .bg-success')) return alert('No active question.');
    closeBtn.textContent = '⏳ Scoring...';
    closeBtn.disabled = true;
    const result = await callAppsScript('closeQuizQuestion', { pin: currentPin });
    closeBtn.textContent = '⏹ Close & Score';
    if (result.success) {
      quizStatus.innerHTML += `<div style="background:#d4edda;padding:10px;border-radius:4px;">Question scored! Leaderboard updated.</div>`;
      closeBtn.disabled = true;
      startBtn.disabled = false;
    } else {
      alert('Error: ' + result.error);
      closeBtn.disabled = false;
    }
  });

  // ---------- Polls ----------
  function subscribeToPollState() {
    if (!currentPin) return;
    const pollRef = db.ref(`rooms/${currentPin}/poll`);
    pollRef.on('value', snapshot => {
      const state = snapshot.val();
      if (!state) {
        pollStatus.textContent = 'No active poll.';
        closePollBtn.disabled = true;
        startPollBtn.disabled = false;
        return;
      }
      if (state.status === 'active') {
        pollStatus.innerHTML = `<strong>Active Poll:</strong> ${state.question}`;
        closePollBtn.disabled = false;
        startPollBtn.disabled = true;
        updatePollChart(state.votes || {}, state.options || []);
      } else if (state.status === 'closed') {
        pollStatus.innerHTML = `Poll closed. Results: ${JSON.stringify(state.votes)}`;
        closePollBtn.disabled = true;
        startPollBtn.disabled = false;
      }
    });
  }

  function updatePollChart(votes, options) {
    const counts = options.map(opt => votes[opt] || 0);
    const ctx = pollChartCanvas.getContext('2d');
    if (pollChartInstance) {
      pollChartInstance.data.datasets[0].data = counts;
      pollChartInstance.update();
    } else {
      pollChartInstance = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: options,
          datasets: [{
            label: 'Votes',
            data: counts,
            backgroundColor: ['#4e79a7','#f28e2b','#e15759','#59a14f']
          }]
        },
        options: { responsive: true, maintainAspectRatio: false }
      });
    }
  }

  startPollBtn.addEventListener('click', async function() {
    const question = pollQuestion.value.trim();
    const optionsRaw = pollOptions.value;
    const options = optionsRaw.split(',').map(s => s.trim()).filter(Boolean);
    if (!question || options.length < 2) {
      alert('Enter a question and at least 2 options.');
      return;
    }
    const result = await callAppsScript('startPoll', { pin: currentPin, question, options });
    if (result.success) {
      pollStatus.textContent = 'Poll started!';
    } else {
      alert('Error: ' + result.error);
    }
  });

  closePollBtn.addEventListener('click', async function() {
    const result = await callAppsScript('closePoll', { pin: currentPin });
    if (result.success) {
      pollStatus.textContent = 'Poll closed.';
    } else {
      alert('Error: ' + result.error);
    }
  });

  // ---------- Groups ----------
  generateGroupsBtn.addEventListener('click', async function() {
    const numGroups = parseInt(numGroupsInput.value);
    if (numGroups < 1) return alert('Enter a valid number.');
    const result = await callAppsScript('generateGroups', { pin: currentPin, numGroups });
    if (result.success) {
      groupsContainer.innerHTML = '';
      result.groups.forEach((group, idx) => {
        const div = document.createElement('div');
        div.className = 'group-box';
        div.innerHTML = `<strong>Group ${idx+1}</strong><br>${group.join(', ')}`;
        groupsContainer.appendChild(div);
      });
    } else {
      alert('Error: ' + result.error);
    }
  });

  // ---------- Attendance ----------
  function subscribeToAttendance() {
    if (!currentPin) return;
    const attRef = db.ref(`rooms/${currentPin}/attendance`);
    attRef.on('value', snapshot => {
      const data = snapshot.val();
      if (!data) {
        attendanceList.innerHTML = 'No check‑ins yet.';
        return;
      }
      const names = Object.keys(data);
      attendanceList.innerHTML = names.map(name => 
        `<div>✅ ${name} – ${data[name].timestamp}</div>`
      ).join('');
    });
  }

  refreshAttendanceBtn.addEventListener('click', function() {
    // Force refresh by re-subscribing? The listener already updates live.
    // We can also fetch from sheet, but it's redundant.
    // Just a UI feedback:
    this.textContent = '⟳ Refreshed!';
    setTimeout(() => this.textContent = '⟳ Refresh', 1000);
  });

  // Initial load if PIN set in URL
  (function init() {
    const params = new URLSearchParams(window.location.search);
    const pin = params.get('pin');
    if (pin) {
      pinInput.value = pin;
      joinBtn.click();
    }
  })();
</script>
</body>
</html>
